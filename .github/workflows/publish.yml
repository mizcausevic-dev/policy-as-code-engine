name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    name: Verify tagged release (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Check tag, main ancestry, and project version
        run: |
          git fetch origin main
          tagged_commit=$(git rev-parse "$GITHUB_SHA^{commit}")
          git merge-base --is-ancestor "$tagged_commit" FETCH_HEAD
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match project version {version!r}")
          PY
      - name: Install and verify source
        run: |
          python -m pip install -e ".[dev]"
          ruff check src tests scripts
          ruff format --check src tests scripts
          mypy src scripts
          pytest -q

  build:
    name: Build and verify wheel + sdist
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.5.0" "twine==7.0.0"
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: |
          python -m twine check dist/*
          python scripts/check_dist.py
      - name: Install and import the built wheel outside the source tree
        run: |
          python -m pip install --only-binary=:all: --target "$RUNNER_TEMP/policy-wheel" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/policy-wheel" python - <<'PY'
          import importlib.metadata as metadata
          import os
          from pathlib import Path

          import policy_as_code_engine as package

          target = Path(os.environ["RUNNER_TEMP"], "policy-wheel").resolve()
          assert Path(package.__file__).resolve().is_relative_to(target)
          assert metadata.version("policy-as-code-engine") == os.environ["GITHUB_REF_NAME"][1:]
          PY
      - name: Save verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/policy-as-code-engine
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
